name: nalbook-prod

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nalbook-prod
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  s3:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - s3-data:/var/lib/localstack
    networks:
      - nalbook-prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  s3-init:
    image: amazon/aws-cli@sha256:ce44b800602264c12298bbf3399055a4cefdb9ed4a098abe564afe26e7071bce
    depends_on:
      s3:
        condition: service_healthy
    env_file: .env
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./scripts/s3-init.sh:/s3-init.sh:ro
    networks:
      - nalbook-prod
    entrypoint: ["/bin/sh", "/s3-init.sh"]
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/migrate", "--all-tenants"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?}
      TENANT_DSN_TPL: ${TENANT_DSN_TPL:?}
      JWT_SECRET: ${JWT_SECRET:?}
    networks:
      - nalbook-prod
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/api"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      PORT: "8080"
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?}
      TENANT_DSN_TPL: ${TENANT_DSN_TPL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_BUCKET: ${S3_BUCKET:-nalbook}
      JWT_SECRET: ${JWT_SECRET:?}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
    ports:
      - "8080:8080"
    networks:
      - nalbook-prod
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?}
      TENANT_DSN_TPL: ${TENANT_DSN_TPL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_BUCKET: ${S3_BUCKET:-nalbook}
      JWT_SECRET: ${JWT_SECRET:?}
    networks:
      - nalbook-prod
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["NONE"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    networks:
      - nalbook-prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  nalbook-prod:
    driver: bridge

volumes:
  pgdata:
  s3-data:
